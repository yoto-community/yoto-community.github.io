name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      # Required to read @yoto-community/* from GitHub Packages.
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@yoto-community'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh GitHub metadata
        if: github.event_name == 'schedule'
        run: pnpm enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The bot commit is pushed with GITHUB_TOKEN (which never triggers
      # workflows) and tagged [skip ci], so the nightly refresh cannot loop.
      # It may still be rejected by branch protection: the deploy must not
      # depend on the commit landing, so the step is non-blocking.
      - name: Commit refreshed metadata
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/.meta.json
          git diff --cached --quiet || git commit -m "chore: refresh project metadata [skip ci]"
          git push origin HEAD:main

      - run: pnpm build
      - run: pnpm check:build
      - run: pnpm check:i18n
      - run: pnpm check:budget
      - run: pnpm check:internal-links

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
