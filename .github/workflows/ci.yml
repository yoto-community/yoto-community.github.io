name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dependabot keeps versions current; this gate stops a vulnerable
      # lockfile from reaching main (high and critical only).
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # check:readme must run before build:data: build:data rewrites README.md,
      # so running it first would hide any drift between data/ and the README.
      - run: pnpm validate
      - run: pnpm check:readme
      - run: pnpm build:data

      - run: pnpm test
      - run: pnpm --filter site check
      - run: pnpm check:types

      - run: pnpm build
      - run: pnpm check:build
      - run: pnpm check:i18n
      - run: pnpm check:budget
      - run: pnpm check:internal-links

      # awesome-lint reads the repository description, topics and license from
      # the GitHub API: docs/launch-checklist.md section 2 documents those settings.
      - name: awesome-lint
        run: pnpm exec awesome-lint README.md

      # E2E runs against site/dist, so it must stay after `pnpm build`.
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - run: pnpm --filter site test:e2e
