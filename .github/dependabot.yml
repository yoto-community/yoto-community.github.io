version: 2

registries:
  # @yoto-community/* lives on GitHub Packages. Dependabot reads this token
  # from the *Dependabot* secret store (Settings → Secrets and variables →
  # Dependabot), not from Actions secrets, and it cannot use GITHUB_TOKEN:
  # provide a PAT with the `read:packages` scope.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.PACKAGES_TOKEN }}

updates:
  # pnpm workspace: the lockfile lives at the repository root and covers both
  # the root tooling package and site/.
  - package-ecosystem: npm
    directory: '/'
    registries:
      - github-packages
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check only supports TypeScript 5 and 6 for now.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep the Node types aligned with the Node version used in CI.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
